
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #243b55;
        }

        input, button {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        input {
            box-sizing: border-box;
        }

        button {
            background: #243b55;
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #41678e;
        }

        .form input {
            width: 100%;
        }

        .search {
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #243b55;
            color: white;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .issued {
            color: red;
            font-weight: bold;
        }

        .stats {
            background: #e5edf5;
            padding: 12px;
            border-radius: 5px;
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Library Management System</h1>

    <h3>Add New Book</h3>
    <div class="form">
        <input type="text" id="title" placeholder="Enter Book Title">
        <input type="text" id="author" placeholder="Enter Author Name">
        <button onclick="addBook()">Add Book</button>
    </div>

    <h3>Search Book</h3>
    <input class="search" type="text" id="search"
           placeholder="Search by title or author"
           oninput="displayBooks()">

    <div class="stats">
        <p>Total Books: <span id="total">0</span></p>
        <p>Available Books: <span id="available">0</span></p>
        <p>Issued Books: <span id="issued">0</span></p>
    </div>

    <h3>Book Records</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="bookList"></tbody>
    </table>
</div>

<script>
    let books = JSON.parse(localStorage.getItem("libraryBooks")) || [
        { id: 1, title: "C Programming", author: "Dennis Ritchie", issued: false },
        { id: 2, title: "Data Structures", author: "Seymour Lipschutz", issued: false },
        { id: 3, title: "JavaScript Basics", author: "John Smith", issued: true }
    ];

    function saveBooks() {
        localStorage.setItem("libraryBooks", JSON.stringify(books));
    }

    function addBook() {
        let title = document.getElementById("title").value.trim();
        let author = document.getElementById("author").value.trim();

        if (title === "" || author === "") {
            alert("Please enter book title and author name.");
            return;
        }

        let book = {
            id: books.length ? Math.max(...books.map(b => b.id)) + 1 : 1,
            title: title,
            author: author,
            issued: false
        };

        books.push(book);
        saveBooks();

        document.getElementById("title").value = "";
        document.getElementById("author").value = "";

        displayBooks();
    }

    function displayBooks() {
        let search = document.getElementById("search").value.toLowerCase();
        let list = document.getElementById("bookList");

        list.innerHTML = "";

        let filteredBooks = books.filter(book =>
            book.title.toLowerCase().includes(search) ||
            book.author.toLowerCase().includes(search)
        );

        filteredBooks.forEach(book => {
            let row = document.createElement("tr");

            let values = [
                book.id,
                book.title,
                book.author,
                book.issued ? "Issued" : "Available"
            ];

            values.forEach((value, index) => {
                let cell = document.createElement("td");
                cell.textContent = value;

                if (index === 3) {
                    cell.className = book.issued ? "issued" : "available";
                }

                row.appendChild(cell);
            });

            let actionCell = document.createElement("td");

            let issueButton = document.createElement("button");
            issueButton.textContent = book.issued ? "Return" : "Issue";
            issueButton.onclick = () => toggleBook(book.id);

            let deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.onclick = () => deleteBook(book.id);

            actionCell.appendChild(issueButton);
            actionCell.appendChild(deleteButton);
            row.appendChild(actionCell);
            list.appendChild(row);
        });

        document.getElementById("total").textContent = books.length;
        document.getElementById("available").textContent =
            books.filter(book => !book.issued).length;
        document.getElementById("issued").textContent =
            books.filter(book => book.issued).length;
    }

    function toggleBook(id) {
        let book = books.find(book => book.id === id);

        if (book) {
            book.issued = !book.issued;
            saveBooks();
            displayBooks();
        }
    }

    function deleteBook(id) {
        if (confirm("Are you sure you want to delete this book?")) {
            books = books.filter(book => book.id !== id);
            saveBooks();
            displayBooks();
        }
    }

    displayBooks();
</script>

</body>
  </html>
